<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Eleven v4 voice starter</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 48px auto; padding: 0 20px; line-height: 1.6; color: #222; }
    textarea { width: 100%; min-height: 90px; box-sizing: border-box; font: inherit; padding: 10px; }
    button { margin-top: 10px; padding: 8px 16px; font: inherit; cursor: pointer; }
    audio { display: block; width: 100%; margin: 12px 0; }
    li { margin: 18px 0; }
    .hint { color: #666; }
  </style>
</head>
<body>
  <h1>Eleven v4 语音</h1>
  <p class="hint">这是本机示例页面。MCP 调用选择 web 出口时，语音会出现在下方列表。</p>
  <form id="preview-form">
    <label for="text">先试听一句</label>
    <textarea id="text" maxlength="2000">你好，这是我的第一段 Eleven v4 语音。</textarea>
    <button type="submit">生成试听</button>
  </form>
  <p id="status" role="status"></p>
  <audio id="preview" controls hidden></audio>
  <h2>MCP 发来的语音</h2>
  <ol id="voices"></ol>
  <script>
    const status = document.getElementById("status");
    const preview = document.getElementById("preview");
    const voices = document.getElementById("voices");
    let previewUrl;

    document.getElementById("preview-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      status.textContent = "正在生成…";
      try {
        const response = await fetch("/api/preview", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ text: document.getElementById("text").value }),
        });
        if (!response.ok) throw new Error("HTTP " + response.status);
        if (previewUrl) URL.revokeObjectURL(previewUrl);
        previewUrl = URL.createObjectURL(await response.blob());
        preview.src = previewUrl;
        preview.hidden = false;
        status.textContent = "已生成，可以播放。";
      } catch (error) {
        status.textContent = "生成失败：" + error.message;
      }
    });

    async function refresh() {
      try {
        const response = await fetch("/api/voices");
        if (!response.ok) return;
        const list = (await response.json()).voices;
        voices.replaceChildren();
        for (const item of list) {
          const row = document.createElement("li");
          const audio = document.createElement("audio");
          audio.controls = true;
          audio.src = item.url;
          row.append(audio);
          voices.append(row);
        }
      } catch {
        // A temporary polling failure does not interrupt an active audio player.
      }
    }
    refresh();
    setInterval(refresh, 5000);
  </script>
</body>
</html>
